# ---------------------------------------------------------------------------
# TravelSafe — pokretanje cele aplikacije jednom komandom:
#
#   docker compose up --build
#
# Frontend:   http://localhost:3000
# API:        http://localhost:8000/api
# Swagger UI: http://localhost:8000/api-docs/
# ---------------------------------------------------------------------------

services:

  # --------------------------- BAZA (MySQL) ---------------------------
  db:
    image: mysql:8.0
    container_name: travelsafe-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: travelsafe
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Port 3307 na racunaru da ne bi bilo sudara sa lokalnim MySQL-om (XAMPP).
      - "3307:3306"
    volumes:
      # Podaci ostaju sacuvani i posle gasenja kontejnera.
      - travelsafe-db-data:/var/lib/mysql
    healthcheck:
      # Backend ceka da baza zaista pocne da prihvata konekcije.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------ BACKEND (Laravel) -------------------------
  backend:
    build: ./backend
    container_name: travelsafe-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: TravelSafe
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:86fBnDhmQy26Mf5UeU2ToXmQosUNfEWCeIp8taiHHz0=
      APP_URL: http://localhost:8000

      # Naziv servisa "db" je ujedno i hostname baze unutar Docker mreze.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: travelsafe
      DB_USERNAME: root
      DB_PASSWORD: root

      # CORS — adrese sa kojih je dozvoljen poziv API-ja.
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"

  # ------------------------- FRONTEND (React) -------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Browser radi na racunaru, pa API zove preko localhost:8000.
        REACT_APP_API_URL: http://localhost:8000/api
    container_name: travelsafe-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  travelsafe-db-data:
