server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React Router radi na strani browsera, pa server svaku nepoznatu putanju
    # (npr. /packages ili /client/policies) vraca kao index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
