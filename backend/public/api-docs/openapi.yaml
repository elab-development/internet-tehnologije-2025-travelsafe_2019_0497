      responses:
        "200":
          description: Podaci su izmenjeni.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      message: { type: string, example: "Insured person updated" }
                      data: { $ref: "#/components/schemas/InsuredPerson" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Osoba pripada tuđem putovanju.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
