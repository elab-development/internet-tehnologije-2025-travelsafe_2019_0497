              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      message: { type: string, example: "Insured person removed" }
                      data: { nullable: true, example: null }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Osoba pripada tuđem putovanju.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "404": { $ref: "#/components/responses/NotFound" }

  # =========================================================== POLICIES
  /api/policies:
    get:
      tags: [Policies]
      summary: Lista polisa
      description: CLIENT vidi samo svoje polise; AGENT i ADMIN vide sve.
      parameters:
        - name: status
          in: query
          required: false
          description: Opcioni filter po statusu polise.
          schema:
            type: string
            enum: [SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, PAYMENT_PENDING, ACTIVE, EXPIRED]
          example: SUBMITTED
      responses:
        "200":
          description: Lista polisa (najnovije prve), sa učitanim relacijama.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      message: { type: string, example: "Policies list" }
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Policy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Policies]
      summary: Podnošenje zahteva za polisu (CLIENT)
      description: |
        Putovanje mora pripadati prijavljenom klijentu, ne sme već imati polisu
        i mora imati bar jednu osiguranu osobu. Novi zahtev dobija status `SUBMITTED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [travel_id, insurance_package_id]
              properties:
                travel_id: { type: integer, example: 1 }
                insurance_package_id: { type: integer, example: 1 }
      responses:
        "201":
          description: Zahtev je podnet.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      message: { type: string, example: "Policy request submitted" }
                      data: { $ref: "#/components/schemas/Policy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Putovanje pripada drugom klijentu.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                success: false
                message: "You can only insure your own travels."
                errors: null
        "422":
          description: |
            Putovanje već ima polisu, nema nijednog putnika, ili validacija nije prošla.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiError"
                  - $ref: "#/components/schemas/ValidationError"
              examples:
                vec_ima_polisu:
                  summary: Putovanje već ima polisu
                  value: { success: false, message: "This travel already has a policy.", errors: null }
                nema_putnika:
                  summary: Nema nijedne osigurane osobe
                  value: { success: false, message: "Add at least one insured person before submitting.", errors: null }

  /api/policies/{policy}:
    parameters:
      - name: policy
        in: path
        required: true
        description: ID polise.
        schema: { type: integer }
        example: 1
    get:
      tags: [Policies]
      summary: Detalji polise
      responses:
        "200":
          description: Polisa sa klijentom, agentom, putovanjem i paketom.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      message: { type: string, example: "Policy details" }
                      data: { $ref: "#/components/schemas/Policy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Polisa pripada drugom klijentu.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
              example:
                message: "This policy does not belong to you."
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Policies]
      summary: Promena izabranog paketa
      description: Dozvoljeno samo dok je zahtev u statusu `SUBMITTED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [insurance_package_id]
              properties:
                insurance_package_id: { type: integer, example: 2 }
      responses:
        "200":
          description: Paket je promenjen.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      message: { type: string, example: "Policy updated" }
                      data: { $ref: "#/components/schemas/Policy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Polisa pripada drugom klijentu.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Polisa nije u statusu SUBMITTED, ili validacija nije prošla.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                success: false
                message: "Only submitted requests can be modified."
                errors: null
    delete:
      tags: [Policies]
      summary: Otkazivanje/brisanje polise
      description: |
        CLIENT sme da obriše samo svoj zahtev koji je još u statusu `SUBMITTED`;
        ADMIN i AGENT mogu da obrišu bilo koju polisu.
      responses:
        "200":
          description: Polisa je obrisana.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      message: { type: string, example: "Policy deleted" }
                      data: { nullable: true, example: null }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Tuđa polisa ili zahtev više nije u statusu SUBMITTED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                success: false
                message: "You can only cancel your own pending requests."
                errors: null
        "404": { $ref: "#/components/responses/NotFound" }

  /api/policies/{policy}/approve:
    parameters:
      - name: policy
        in: path
        required: true
        description: ID polise koja se odobrava.
        schema: { type: integer }
        example: 1
    patch:
      tags: [Policies]
      summary: Odobravanje zahteva (AGENT ili ADMIN)
      description: |
        Agent unosi konačnu cenu. Sistem automatski dodeljuje broj polise
        (oblik `TS-<godina>-<6 znakova>`), upisuje agenta i briše eventualni raniji
        razlog odbijanja. Status prelazi u `APPROVED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [total_price]
              properties:
                total_price: { type: number, minimum: 0, example: 112.0 }
      responses:
        "200":
          description: Zahtev je odobren.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      message: { type: string, example: "Policy approved" }
                      data: { $ref: "#/components/schemas/Policy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Polisa nije u statusu SUBMITTED/UNDER_REVIEW, ili validacija nije prošla.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                success: false
                message: "Only submitted requests can be approved."
                errors: null

  /api/policies/{policy}/reject:
    parameters:
      - name: policy
        in: path
        required: true
        description: ID polise koja se odbija.
        schema: { type: integer }
        example: 1
    patch:
      tags: [Policies]
      summary: Odbijanje zahteva (AGENT ili ADMIN)
      description: Razlog odbijanja je obavezan i vidi ga klijent. Status prelazi u `REJECTED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejection_reason]
              properties:
                rejection_reason:
                  type: string
                  maxLength: 500
                  example: "Destinacija nije pokrivena izabranim paketom."
      responses:
        "200":
          description: Zahtev je odbijen.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      message: { type: string, example: "Policy rejected" }
                      data: { $ref: "#/components/schemas/Policy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Polisa nije u statusu SUBMITTED/UNDER_REVIEW, ili validacija nije prošla.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                success: false
                message: "Only submitted requests can be rejected."
                errors: null

  /api/policies/{policy}/pay:
    parameters:
      - name: policy
        in: path
        required: true
        description: ID odobrene polise koja se plaća.
        schema: { type: integer }
        example: 1
    patch:
      tags: [Policies]
      summary: Simulacija plaćanja (CLIENT)
      description: |
        Platiti može samo vlasnik polise i samo ako je polisa u statusu `APPROVED`.
        Nakon plaćanja status prelazi u `ACTIVE`. Telo zahteva se ne šalje.
      responses:
        "200":
          description: Plaćanje je uspelo, polisa je aktivna.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      message: { type: string, example: "Payment successful, policy is now active" }
                      data: { $ref: "#/components/schemas/Policy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Polisa pripada drugom korisniku.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                success: false
                message: "This policy does not belong to you."
                errors: null
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Polisa nije u statusu APPROVED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                success: false
                message: "Only approved policies can be paid."
                errors: null

