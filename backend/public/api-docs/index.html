<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <title>TravelSafe API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
  <style> body { margin: 0; } </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>

  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        // Apsolutna putanja da specifikacija radi i sa /api-docs i sa /api-docs/index.html.
        url: "/api-docs/openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "BaseLayout",

        // Token unet kroz dugme "Authorize" ostaje sacuvan i posle osvezavanja stranice.
        persistAuthorization: true,

        // Posle uspesnog logina token se automatski upisuje u "Authorize",
        // pa ne mora rucno da se kopira iz odgovora.
        responseInterceptor: (res) => {
          try {
            if (res.ok && /\/api\/auth\/(login|register)$/.test(res.url)) {
              const token = JSON.parse(res.text)?.data?.token;
              if (token) {
                window.ui.authActions.authorize({
                  bearerAuth: {
                    name: "bearerAuth",
                    schema: { type: "http", scheme: "bearer" },
                    value: token,
                  },
                });
              }
            }
          } catch (e) {
            // Ako odgovor nije ocekivanog oblika, samo ga prosledimo dalje.
          }
          return res;
        },
      });
    };
  </script>
</body>
</html>
